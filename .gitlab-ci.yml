stages:
  - build

spec:
  inputs:
    environment:
      default: staging
      options: [staging, production]
      type: enum
    deploy_version:
      description: "The version tag to deploy"

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: plain
  BUILD_TARGET:
    value: "default"
    description: "Select the build target (default, toolkit-v29, toolkit-v30)"
    options:
      - "default"
      - "toolkit-v29"
      - "toolkit-v30"

build-docker:
  stage: build
  image: docker:27.5.1
  tags: [k8s, azure, dev]
  when: manual
  services:
    - name: docker:27.5.1-dind
      alias: docker
  before_script:
    - set -euo pipefail
    - echo "$HARBOR_PASSWORD" | docker login harbor.sde.adifoundation.ai -u "$HARBOR_USERNAME" --password-stdin
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is up!"
          break
        fi
        echo "Waiting for Docker daemon... $i"
        sleep 1
      done
      docker info

    - wget -qO- https://taskfile.dev/install.sh | sh -s -- -d -b /usr/local/bin

    - docker run --privileged --rm tonistiigi/binfmt --install all

    - docker buildx create --name multi --driver docker-container --use
    - docker buildx inspect --bootstrap

  script:
    - task push:docker TARGETS=$BUILD_TARGET
