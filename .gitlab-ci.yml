spec:
  inputs:
    build_target:
      default: default
      options: [default, toolkit-v29, toolkit-v30]
      description: "Select the build target (default, toolkit-v29, toolkit-v30)"

---
stages:
  - build

variables:

  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: plain
  RUNNER_SCRIPT_TIMEOUT: 4h

# Trigger job to start the multiarch build pipeline
trigger-build-docker:
  stage: build
  when: manual
  script:
    - echo "Starting multiarch build for target $build_target..."

# Build AMD64 image on native AMD64 runner
build-docker-amd64:
  stage: build
  image: docker:27.5.1
  tags: [k8s, azure, dev]
  needs: ["trigger-build-docker"]
  services:
    - name: docker:27.5.1-dind
      alias: docker
  before_script:
    - set -euo pipefail
    - echo "$HARBOR_PASSWORD" | docker login harbor-v2.dev.internal.adifoundation.ai -u "$HARBOR_USERNAME" --password-stdin
    - |
      for i in $(seq 1 60); do
        if docker info > /dev/null 2>&1; then
          echo "Docker daemon is up!"
          break
        fi
        echo "Waiting for Docker daemon... $i"
        sleep 1
      done
      docker info
    # No binfmt needed - building native architecture
    - docker buildx create --name builder-amd64 --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      REGISTRY="harbor-v2.dev.internal.adifoundation.ai/adi-chain/cli"
      TARGET="$build_target"

      # Determine version tag based on target
      if [ "$TARGET" = "toolkit-v29" ]; then
        VERSION_TAG="v29"
      elif [ "$TARGET" = "toolkit-v30" ]; then
        VERSION_TAG="v30"
      else
        VERSION_TAG="latest"
      fi

      # Build and push AMD64 image
      PLATFORM=linux/amd64 \
      CACHE_TO_REF="$REGISTRY/adi-toolkit:cache-amd64-${CI_COMMIT_REF_SLUG}" \
      docker buildx bake -f docker/docker-bake.hcl --push \
        --set "*.tags=$REGISTRY/adi-toolkit:$VERSION_TAG-amd64-${CI_COMMIT_SHORT_SHA}" \
        $TARGET

# Build ARM64 image on native ARM64 runner
build-docker-arm64:
  stage: build
  image: docker:27.5.1
  tags: [k8s, azure-arm, dev]
  needs: ["trigger-build-docker"]
  services:
    - name: docker:27.5.1-dind
      alias: docker
  before_script:
    - set -euo pipefail
    - echo "$HARBOR_PASSWORD" | docker login harbor-v2.dev.internal.adifoundation.ai -u "$HARBOR_USERNAME" --password-stdin
    - |
      for i in $(seq 1 60); do
        if docker info > /dev/null 2>&1; then
          echo "Docker daemon is up!"
          break
        fi
        echo "Waiting for Docker daemon... $i"
        sleep 1
      done
      docker info
    # No binfmt needed - building native architecture
    - docker buildx create --name builder-arm64 --driver docker-container --use
    - docker buildx inspect --bootstrap
  script:
    - |
      REGISTRY="harbor-v2.dev.internal.adifoundation.ai/adi-chain/cli"
      TARGET="$build_target"

      # Determine version tag based on target
      if [ "$TARGET" = "toolkit-v29" ]; then
        VERSION_TAG="v29"
      elif [ "$TARGET" = "toolkit-v30" ]; then
        VERSION_TAG="v30"
      else
        VERSION_TAG="latest"
      fi

      # Build and push ARM64 image
      PLATFORM=linux/arm64 \
      CACHE_TO_REF="$REGISTRY/adi-toolkit:cache-arm64-${CI_COMMIT_REF_SLUG}" \
      docker buildx bake -f docker/docker-bake.hcl --push \
        --set "*.tags=$REGISTRY/adi-toolkit:$VERSION_TAG-arm64-${CI_COMMIT_SHORT_SHA}" \
        $TARGET

# Create multiarch manifest from AMD64 and ARM64 images
build-docker-manifest:
  stage: build
  image: docker:27.5.1
  tags: [k8s, azure, dev]
  needs:
    - build-docker-amd64
    - build-docker-arm64
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login harbor-v2.dev.internal.adifoundation.ai -u "$HARBOR_USERNAME" --password-stdin
  script:
    - |
      REGISTRY="harbor-v2.dev.internal.adifoundation.ai/adi-chain/cli"
      TARGET="$build_target"

      # Determine version tag based on target
      if [ "$TARGET" = "toolkit-v29" ]; then
        VERSION_TAG="v29"
      elif [ "$TARGET" = "toolkit-v30" ]; then
        VERSION_TAG="v30"
      else
        VERSION_TAG="latest"
      fi

      # Create multiarch manifest combining AMD64 and ARM64
      docker buildx imagetools create -t "$REGISTRY/adi-toolkit:$VERSION_TAG" \
        "$REGISTRY/adi-toolkit:$VERSION_TAG-amd64-${CI_COMMIT_SHORT_SHA}" \
        "$REGISTRY/adi-toolkit:$VERSION_TAG-arm64-${CI_COMMIT_SHORT_SHA}"

      # Also tag with commit SHA for traceability
      docker buildx imagetools create -t "$REGISTRY/adi-toolkit:$VERSION_TAG-${CI_COMMIT_SHORT_SHA}" \
        "$REGISTRY/adi-toolkit:$VERSION_TAG-amd64-${CI_COMMIT_SHORT_SHA}" \
        "$REGISTRY/adi-toolkit:$VERSION_TAG-arm64-${CI_COMMIT_SHORT_SHA}"

      echo "✅ Created multiarch manifest: $REGISTRY/adi-toolkit:$VERSION_TAG"
      echo "   - linux/amd64: $REGISTRY/adi-toolkit:$VERSION_TAG-amd64-${CI_COMMIT_SHORT_SHA}"
      echo "   - linux/arm64: $REGISTRY/adi-toolkit:$VERSION_TAG-arm64-${CI_COMMIT_SHORT_SHA}"
