[package]
name = "adi-cli"
version = "0.1.0"
edition = "2021"


[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = false


[dependencies]
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
tokio = { version = "1", default-features = false, features = ["full"] }

colored = "3"
eyre = "0.6"
log = { version = "0.4", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
built = { version = "0.7", features = ["git2"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"

# Crypto and EVM types (alloy 1.x ecosystem)
alloy-primitives = { version = "1", default-features = false }
alloy-signer = { version = "1", default-features = false }
alloy-signer-local = { version = "1", default-features = false }
alloy-provider = { version = "1", default-features = false }

# Version handling
semver = { version = "1", features = ["serde"] }

# Security
secrecy = { version = "0.8", features = ["serde"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
hex = "0.4"
serde_yaml = "0.9"
toml = "0.8"
serde_json = "1"

[build-dependencies]
built = { version = "0.7", features = ["git2"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
large_enum_variant = "allow"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
redundant_clone = "deny"
wildcard_imports = "deny"
indexing_slicing = "deny"
needless_collect = "deny"
trivially_copy_pass_by_ref = "deny"
match_bool = "deny"
map_entry = "deny"
manual_flatten = "deny"
needless_return = "deny"
semicolon_if_nothing_returned = "deny"
needless_question_mark = "deny"
explicit_into_iter_loop = "deny"
iter_nth_zero = "deny"
bind_instead_of_map = "deny"
manual_filter_map = "deny"
double_ended_iterator_last = "allow"
