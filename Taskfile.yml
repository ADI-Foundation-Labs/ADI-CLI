# https://taskfile.dev

version: "3"

vars:
  ANVIL_PORT: "8545"
  ANVIL_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  ANVIL_RPC_URL: "http://localhost:{{.ANVIL_PORT}}"

tasks:
  _install_rust:
    internal: true
    status:
      - rustc --version
    cmds:
      - curl https://sh.rustup.rs -sSf | sh

  build:
    desc: Build the CLI in development mode
    deps:
      - _install_rust
    cmds:
      - cargo build

  build:release:
    desc: Build the CLI in release mode
    deps:
      - _install_rust
    cmds:
      - cargo build --release

  # ====================
  # Testing
  # ====================

  test:
    desc: Run all tests
    deps:
      - _install_rust
    cmds:
      - cargo test

  test:unit:
    desc: Run unit tests only
    deps:
      - _install_rust
    cmds:
      - cargo test --lib

  test:integration:
    desc: Run integration tests only
    deps:
      - _install_rust
    cmds:
      - cargo test --test '*'

  lint:
    desc: Run clippy linter with strict rules
    deps:
      - _install_rust
    cmds:
      - cargo clippy -- -D warnings

  fmt:
    desc: Format code with rustfmt
    deps:
      - _install_rust
    cmds:
      - cargo fmt

  fmt:check:
    desc: Check code formatting
    deps:
      - _install_rust
    cmds:
      - cargo fmt -- --check

  check:
    desc: Run all checks (fmt, lint, test)
    deps:
      - _install_rust
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  # ====================
  # Docker / Toolkit
  # ====================

  build:docker:
    desc: Build Docker images using Docker Bake
    vars:
      TARGETS: '{{default "default" .TARGETS}}'
    sources:
      - docker/worker/Dockerfile
      - docker/docker-bake.hcl
    generates:
      - .task/build_docker_{{.TARGETS}}
    preconditions:
      - docker ps
      - docker buildx version
      - docker buildx bake --help
    cmds:
      - docker buildx bake -f docker/docker-bake.hcl {{.TARGETS}}
      - mkdir -p .task && touch .task/build_docker_{{.TARGETS}}

  build:toolkit:
    desc: Build all toolkit images (v29 + v30)
    cmds:
      - task: build:docker
        vars:
          TARGETS: default

  build:toolkit:v29:
    desc: Build toolkit image for protocol v29
    cmds:
      - task: build:docker
        vars:
          TARGETS: toolkit-v29

  build:toolkit:v30:
    desc: Build toolkit image for protocol v30
    cmds:
      - task: build:docker
        vars:
          TARGETS: toolkit-v30

  push:docker:
    desc: Build and push Docker images using Docker Bake
    vars:
      TARGETS: '{{default "default" .TARGETS}}'
    cmds:
      - docker buildx bake -f docker/docker-bake.hcl --push {{.TARGETS}}

  push:toolkit:
    desc: Build and push all toolkit images
    cmds:
      - task: push:docker
        vars:
          TARGETS: default

  push:toolkit:v29:
    desc: Build and push toolkit v29 image
    cmds:
      - task: push:docker
        vars:
          TARGETS: toolkit-v29

  push:toolkit:v30:
    desc: Build and push toolkit v30 image
    cmds:
      - task: push:docker
        vars:
          TARGETS: toolkit-v30

  # ====================
  # Local Anvil Testing
  # ====================

  anvil:start:
    desc: Start local Anvil instance for testing
    preconditions:
      - sh: command -v anvil
        msg: "Anvil not found. Install foundry: curl -L https://foundry.paradigm.xyz | bash && foundryup"
    cmds:
      - |
        echo "Starting Anvil on port {{.ANVIL_PORT}}..."
        anvil --host 0.0.0.0 --port {{.ANVIL_PORT}} &
        sleep 2
        echo "Anvil started. Default private key: {{.ANVIL_PRIVATE_KEY}}"
        echo "RPC URL: {{.ANVIL_RPC_URL}}"

  anvil:stop:
    desc: Stop local Anvil instance
    cmds:
      - |
        pkill -f "anvil.*--port {{.ANVIL_PORT}}" || echo "No Anvil process found"
        echo "Anvil stopped"

  test:anvil:
    desc: Run deployment tests against local Anvil
    deps:
      - build
    preconditions:
      - sh: command -v anvil
        msg: "Anvil not found. Install foundry: curl -L https://foundry.paradigm.xyz | bash && foundryup"
    env:
      ADI_SETTLEMENT_RPC_URL: "{{.ANVIL_RPC_URL}}"
      ADI_FUNDER_PRIVATE_KEY: "{{.ANVIL_PRIVATE_KEY}}"
    cmds:
      - |
        echo "Starting Anvil for deployment test..."
        anvil --host 0.0.0.0 --port {{.ANVIL_PORT}} &
        ANVIL_PID=$!
        sleep 2

        echo "Anvil started (PID: $ANVIL_PID)"
        echo "Running deployment tests..."

        # Run integration tests that require Anvil
        cargo test --test '*' -- --ignored anvil || TEST_EXIT=$?

        echo "Stopping Anvil..."
        kill $ANVIL_PID 2>/dev/null || true

        exit ${TEST_EXIT:-0}

  test:deploy:ecosystem:
    desc: Test ecosystem deployment against local Anvil
    deps:
      - build
    preconditions:
      - sh: command -v anvil
        msg: "Anvil not found. Install foundry: curl -L https://foundry.paradigm.xyz | bash && foundryup"
    env:
      ADI_SETTLEMENT_RPC_URL: "{{.ANVIL_RPC_URL}}"
      ADI_FUNDER_PRIVATE_KEY: "{{.ANVIL_PRIVATE_KEY}}"
    cmds:
      - |
        echo "Starting Anvil for ecosystem deployment test..."
        anvil --host 0.0.0.0 --port {{.ANVIL_PORT}} &
        ANVIL_PID=$!
        sleep 2

        echo "Anvil started (PID: $ANVIL_PID)"

        # Initialize ecosystem
        echo "Initializing ecosystem..."
        ./target/debug/adi init ecosystem --name test_ecosystem --settlement-network localhost

        # Deploy ecosystem
        echo "Deploying ecosystem..."
        ./target/debug/adi deploy ecosystem

        # Verify deployment
        echo "Verifying deployment..."
        ./target/debug/adi version

        echo "Stopping Anvil..."
        kill $ANVIL_PID 2>/dev/null || true

        echo "Ecosystem deployment test completed"

  test:deploy:chain:
    desc: Test chain deployment against local Anvil (requires ecosystem)
    deps:
      - build
    preconditions:
      - sh: command -v anvil
        msg: "Anvil not found. Install foundry: curl -L https://foundry.paradigm.xyz | bash && foundryup"
    env:
      ADI_SETTLEMENT_RPC_URL: "{{.ANVIL_RPC_URL}}"
      ADI_FUNDER_PRIVATE_KEY: "{{.ANVIL_PRIVATE_KEY}}"
    cmds:
      - |
        echo "Starting Anvil for chain deployment test..."
        anvil --host 0.0.0.0 --port {{.ANVIL_PORT}} &
        ANVIL_PID=$!
        sleep 2

        echo "Anvil started (PID: $ANVIL_PID)"

        # Initialize chain
        echo "Initializing chain..."
        ./target/debug/adi init chain --name test_chain --chain-id 270 --base-token eth --prover-mode no-proofs

        # Deploy chain
        echo "Deploying chain..."
        ./target/debug/adi deploy chain --chain-name test_chain

        echo "Stopping Anvil..."
        kill $ANVIL_PID 2>/dev/null || true

        echo "Chain deployment test completed"

  test:full-flow:
    desc: Test full deployment flow (ecosystem + chain) against local Anvil
    deps:
      - build
    preconditions:
      - sh: command -v anvil
        msg: "Anvil not found. Install foundry: curl -L https://foundry.paradigm.xyz | bash && foundryup"
    env:
      ADI_SETTLEMENT_RPC_URL: "{{.ANVIL_RPC_URL}}"
      ADI_FUNDER_PRIVATE_KEY: "{{.ANVIL_PRIVATE_KEY}}"
    cmds:
      - |
        echo "=== Full Deployment Flow Test ==="
        echo "Starting Anvil for full flow test..."
        anvil --host 0.0.0.0 --port {{.ANVIL_PORT}} &
        ANVIL_PID=$!
        sleep 2

        echo "Anvil started (PID: $ANVIL_PID)"

        # Step 1: Initialize ecosystem
        echo ""
        echo "=== Step 1: Initialize Ecosystem ==="
        ./target/debug/adi init ecosystem --name test_ecosystem --settlement-network localhost

        # Step 2: Deploy ecosystem
        echo ""
        echo "=== Step 2: Deploy Ecosystem ==="
        ./target/debug/adi deploy ecosystem

        # Step 3: Initialize chain
        echo ""
        echo "=== Step 3: Initialize Chain ==="
        ./target/debug/adi init chain --name test_chain --chain-id 270 --base-token eth --prover-mode no-proofs

        # Step 4: Deploy chain
        echo ""
        echo "=== Step 4: Deploy Chain ==="
        ./target/debug/adi deploy chain --chain-name test_chain

        echo ""
        echo "Stopping Anvil..."
        kill $ANVIL_PID 2>/dev/null || true

        echo ""
        echo "=== Full flow test completed successfully ==="
