# https://taskfile.dev

version: "3"

vars:
  REGISTRY: harbor-v2.dev.internal.adifoundation.ai/adi-chain/cli
  CACHE_REF_SLUG: '{{default "main" .CI_COMMIT_REF_SLUG}}'
  # Default platform to linux/arm64 for local dev (Apple Silicon friendly)
  PLATFORM: '{{default "linux/arm64" .PLATFORM}}'
  TARGETS: '{{default "default" .TARGETS}}'

  # Determine VERSION_TAG based on TARGETS
  VERSION_TAG:
    sh: |
      case "{{.TARGETS}}" in
        "toolkit-v29") echo "v29" ;;
        "toolkit-v30") echo "v30" ;;
        *) echo "latest" ;;
      esac

tasks:
  _install_rust:
    internal: true
    status:
      - rustc --version
    cmds:
      - curl https://sh.rustup.rs -sSf | sh

  fmt:
    desc: Format Rust code
    cmds:
      - cargo fmt

  lint:
    desc: Lint Rust code
    cmds:
      - cargo clippy -- -D warnings

  test:
    desc: Run Rust tests
    cmds:
      - cargo test

  build:
    desc: Build Rust binary
    deps:
      - _install_rust
    cmds:
      - cargo build

  # Internal task to build and push docker image for a specific architecture
  build:docker:internal:
    internal: true
    vars:
      ARCH_SLUG: '{{default "arm64" .ARCH_SLUG}}'
      REF_SLUG: '{{default "main" .CI_COMMIT_REF_SLUG}}'
      CACHE_TO_REF: '{{.REGISTRY}}/adi-toolkit:cache-{{.ARCH_SLUG}}-{{.REF_SLUG}}'
      LOAD: '{{default "true" .LOAD}}'
      PUSH: '{{default "false" .PUSH}}'
    cmds:
      - |
        # Construct tags list
        MAIN_TAG="{{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-{{.ARCH_SLUG}}-{{.CI_COMMIT_SHORT_SHA}}"
        EXTRA_TAG="{{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}"

        if [ "{{.LOAD}}" = "true" ]; then
          TAGS="[\"$MAIN_TAG\",\"$EXTRA_TAG\"]"
        else
          TAGS="[\"$MAIN_TAG\"]"
        fi

        PLATFORM={{.PLATFORM}} \
        CACHE_TO_REF={{.CACHE_TO_REF}} \
        TAGS="$TAGS" \
        docker buildx bake -f docker/docker-bake.hcl \
        {{if eq .LOAD "true"}}--load{{end}} \
        {{if eq .PUSH "true"}}--push{{end}} \
        {{.TARGETS}}

  build:docker:amd64:
    desc: Build and push Docker image for linux/amd64
    cmds:
      - task: build:docker:internal
        vars: { PLATFORM: "linux/amd64", ARCH_SLUG: "amd64" }

  build:docker:arm64:
    desc: Build and push Docker image for linux/arm64
    cmds:
      - task: build:docker:internal
        vars: { PLATFORM: "linux/arm64", ARCH_SLUG: "arm64" }

  build:docker:manifest:
    desc: Create and push multiarch manifest
    vars:
      REF_SLUG: '{{default "main" .CI_COMMIT_REF_SLUG}}'
    cmds:
      # Push mutable tag: v29-branch
      - |
        docker buildx imagetools create -t {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}} \
          {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-amd64-{{.CI_COMMIT_SHORT_SHA}} \
          {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-arm64-{{.CI_COMMIT_SHORT_SHA}}

      # Push immutable tag: v29-branch-sha
      - |
        docker buildx imagetools create -t {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-{{.CI_COMMIT_SHORT_SHA}} \
          {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-amd64-{{.CI_COMMIT_SHORT_SHA}} \
          {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-arm64-{{.CI_COMMIT_SHORT_SHA}}

      # Push "latest" version tag only for main: v29
      - |
        if [ "{{.REF_SLUG}}" = "main" ]; then
          docker buildx imagetools create -t {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}} \
            {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-amd64-{{.CI_COMMIT_SHORT_SHA}} \
            {{.REGISTRY}}/adi-toolkit:{{.VERSION_TAG}}-{{.REF_SLUG}}-arm64-{{.CI_COMMIT_SHORT_SHA}}
        fi
